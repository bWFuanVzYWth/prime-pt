import groovy.json.JsonOutput
import java.security.DigestInputStream
import java.security.MessageDigest
import java.util.HexFormat

plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
}
version = '0.1.0'
group = 'dev.primept'
base { archivesName = 'prime-pt' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    // 26.3 的 Fabric API 0.161.0+26.3 资源加载模块将 Mod 的 assets 加入客户端资源栈。
    include(implementation('net.fabricmc.fabric-api:fabric-resource-loader-v1:3.0.4+fcdff87f5d'))
}
sourceSets.main.java.srcDirs = ['java/src/main/java']
sourceSets.main.resources.srcDirs = ['java/src/main/resources']
sourceSets {
    fixture {
        java.srcDirs = ['java/src/fixture/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
def nativeProfile = providers.gradleProperty('nativeProfile').getOrElse('release-lto')
if (!(nativeProfile in ['release-lto', 'release'])) {
    throw new GradleException('nativeProfile 须为 release-lto 或 release')
}
def cargoTargetDir = providers.environmentVariable('CARGO_TARGET_DIR')
        .map { rootProject.file(it) }.getOrElse(rootProject.file('target'))
def nativeOutputDir = new File(cargoTargetDir, nativeProfile)
def nativeDll = new File(nativeOutputDir, 'prime_pt.dll')
def nativeLibraryOverride = providers.gradleProperty('nativeLibrary')
def nativeLibraryPath = nativeLibraryOverride.map { rootProject.file(it).absolutePath }
        .getOrElse(nativeDll.absolutePath)
def slangVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../scripts/tools.json')).slang.version
def pinnedSlang = rootProject.file("../../target/tools/slang/${slangVersion}/windows-x86_64/bin/slangc.exe")
def slangCompiler = providers.environmentVariable('SLANGC').map { rootProject.file(it) }.getOrElse(pinnedSlang)

loom {
    runs {
        client {
            client()
            runDir = providers.gradleProperty('diagnosticRunDir').getOrElse('run')
            vmArgs '--enable-native-access=ALL-UNNAMED'
            vmArgs "-Dprimept.native=${nativeLibraryPath}"
            vmArgs "-Dprimept.rr=${providers.gradleProperty('rr').getOrElse('true')}"
            vmArgs "-Dprimept.windowDiagnostic=${providers.gradleProperty('windowDiagnostic').getOrElse('false')}"
            if (providers.gradleProperty('diagnosticWorld').isPresent()) {
                programArgs '--quickPlaySingleplayer', providers.gradleProperty('diagnosticWorld').get(), '--width', '3840', '--height', '2160'
            }
            if (providers.gradleProperty('ser').isPresent())
                vmArgs "-Dprimept.ser=${providers.gradleProperty('ser').get()}"
            programArgs '--graphicsBackend', 'VULKAN'
        }
    }
}
def streamlineSdk = providers.environmentVariable('STREAMLINE_SDK').getOrElse(rootProject.file('../../target/streamline-sdk').absolutePath)
def buildRoots = [
        'source': rootProject.file('../..'),
        'cargo': providers.environmentVariable('CARGO_HOME').map { rootProject.file(it) }.orNull,
        'rustup': providers.environmentVariable('RUSTUP_HOME').map { rootProject.file(it) }.orNull,
        'target': cargoTargetDir,
        'home': rootProject.file(System.getProperty('user.home')),
        'sdk': rootProject.file(streamlineSdk),
        'slang': slangCompiler.parentFile.parentFile,
].findAll { name, file -> file != null }
def pathSpellings = { File directory ->
    def path = directory.toPath().toAbsolutePath().normalize().toString()
    [path.replace('\\', '/'), path.replace('/', '\\')].unique()
}

tasks.register('verifyStreamline', Exec) {
    workingDir rootDir
    commandLine 'pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/setup-streamline.ps1', '-SdkRoot', streamlineSdk, '-VerifyOnly'
}
tasks.register('buildNative', Exec) {
    dependsOn tasks.named('verifyStreamline')
    workingDir rootDir
    environment 'STREAMLINE_SDK', streamlineSdk
    environment 'CARGO_TARGET_DIR', cargoTargetDir.absolutePath
    if (slangCompiler.isFile()) environment 'SLANGC', slangCompiler.absolutePath
    def args = ['cargo', 'build', '--profile', nativeProfile, '--locked', '--manifest-path', 'native/Cargo.toml']
    def remaps = buildRoots.collectMany { name, directory ->
        pathSpellings(directory).collect { "--remap-path-prefix=${it}=/build/${name}".toString() }
    }
    def rustConfig = layout.buildDirectory.file('native/rust-path-remaps.toml').get().asFile
    doFirst {
        rustConfig.parentFile.mkdirs()
        rustConfig.setText("[target.x86_64-pc-windows-msvc]\nrustflags = ${JsonOutput.toJson(remaps)}\n", 'UTF-8')
    }
    args.addAll(['--config', rustConfig.absolutePath])
    if (gradle.startParameter.offline) args.add('--offline')
    commandLine args
}
tasks.named('runClient') {
    if (providers.gradleProperty('diagnosticRunDir').isPresent()) environment 'PRIME_PT_SOURCE_ROOT', rootDir.absolutePath
    if (!nativeLibraryOverride.isPresent()) dependsOn tasks.named('buildNative')
    // 从Nsight GUI启动时也使用已选择的完整Slang发行包，不依赖启动工具的终端环境。
    if (slangCompiler.isFile()) environment 'SLANGC', slangCompiler.absolutePath
}

def vcFiles = ['msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll']
def latestCrt = { candidates ->
    candidates.findAll { directory ->
        directory.name ==~ /Microsoft\.VC\d+\.CRT/ && vcFiles.every { new File(directory, it).isFile() }
    }.max { directory -> directory.parentFile.parentFile.name.tokenize('.').collect { it.padLeft(8, '0') }.join('.') }
}
def vcRedistDir = providers.gradleProperty('vcRedistDir').map { rootProject.file(it) }
        .orElse(providers.environmentVariable('VCToolsRedistDir').map {
            latestCrt(new File(rootProject.file(it), 'x64').listFiles() ?: [])
        }).orElse(providers.provider {
            def installer = providers.environmentVariable('ProgramFiles(x86)').orNull
            def vswhere = installer == null ? null : new File(installer, 'Microsoft Visual Studio/Installer/vswhere.exe')
            if (vswhere?.isFile()) {
                def paths = providers.exec {
                    commandLine vswhere, '-latest', '-products', '*', '-requires',
                            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-utf8',
                            '-find', 'VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT/msvcp140.dll'
                }.standardOutput.asText.get().readLines()
                def directory = latestCrt(paths.findAll { !it.isBlank() }.collect { new File(it).parentFile })
                if (directory != null) return directory
            }
            throw new GradleException('未找到 MSVC x64 CRT 可再发行目录，请用 -PvcRedistDir 指向 Microsoft.VC*.CRT')
        })
def nativeFiles = ['prime_pt.dll', 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss_d.dll', 'nvngx_dlssd.dll',
        'NVIDIA-Streamline.txt', 'streamline-licenses.md', 'nvngx_dlss.license.txt']
def slangFiles = ['slangc.exe', 'slang-compiler.dll', 'slang-glslang.dll']
def slangDistribution = slangCompiler.parentFile.parentFile
def runtimeDirectory = layout.buildDirectory.dir('prime-runtime/windows-x86_64')
def runtimeEntry = 'META-INF/primept/windows-x86_64'
def bundleRuntime = tasks.register('bundleRuntime', Sync) {
    dependsOn tasks.named('buildNative')
    into runtimeDirectory
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(nativeOutputDir) { include nativeFiles }
    from(vcRedistDir) { include vcFiles }
    from(slangCompiler.parentFile) {
        include slangFiles
        into 'slang'
    }
    // Slang 子进程从 exe 同目录加载其 CRT，与 Java 进程预加载的副本隔离。
    from(vcRedistDir) {
        include vcFiles
        into 'slang'
    }
    from(slangDistribution) {
        include 'LICENSE', 'LICENSES/**', 'third-party-notices/**'
        into 'slang'
    }
    from('crates/renderer/shaders') {
        include 'primary.slang', 'pt_hit.slang', 'guides.slang', 'guide_material.slang', 'primary_cache.slang', 'primary_material.slang',
                'params.slang', 'mod_*.slang', 'known_geometry.slang'
        into 'shaders/prime'
    }
    from('../../shaders') {
        include 'atmosphere/*.slang', 'bsdf/openpbr/**/*.slang', 'color/*.slang',
                'display/prime_drt.slang', 'geometry/*.slang', 'pt/*.slang'
        into 'shaders/engine'
    }
    doLast {
        def directory = runtimeDirectory.get().asFile
        def required = nativeFiles + vcFiles + (slangFiles + vcFiles).collect { 'slang/' + it } +
                ['slang/LICENSE', 'shaders/prime/primary.slang', 'shaders/prime/pt_hit.slang',
                 'shaders/prime/guides.slang', 'shaders/prime/guide_material.slang', 'shaders/prime/primary_cache.slang', 'shaders/prime/primary_material.slang',
                 'shaders/prime/known_geometry.slang',
                 'shaders/engine/pt/scene.slang', 'shaders/engine/pt/hit_transport.slang',
                 'shaders/engine/pt/key_guides.slang',
                 'shaders/engine/geometry/identity.slang']
        for (def path : required) {
            def file = new File(directory, path)
            if (!file.isFile() || file.length() == 0) throw new GradleException("发行运行时缺少 ${path}")
        }
        for (def path : ['slang/LICENSES', 'slang/third-party-notices']) {
            if (fileTree(new File(directory, path)).empty) throw new GradleException("发行运行时缺少 ${path}")
        }
        if (nativeProfile == 'release-lto') {
            def binary = new String(new File(directory, 'prime_pt.dll').bytes, 'ISO-8859-1').toLowerCase(Locale.ROOT)
            for (def entry : buildRoots.entrySet()) {
                for (def path : pathSpellings(entry.value)) {
                    for (def encoding : ['UTF-8', 'UTF-16LE']) {
                        def needle = new String(path.getBytes(encoding), 'ISO-8859-1').toLowerCase(Locale.ROOT)
                        if (binary.contains(needle)) throw new GradleException("发行 DLL 含本机路径：${entry.key}")
                    }
                }
            }
        }
        def prefix = directory.toPath()
        def files = fileTree(directory).matching { exclude 'manifest.sha256' }.files.collectEntries {
            [(prefix.relativize(it.toPath()).toString().replace('\\', '/')): it]
        }.sort()
        def manifest = new File(directory, 'manifest.sha256')
        manifest.setText(files.collect { path, file ->
            def hash = MessageDigest.getInstance('SHA-256')
            file.withInputStream { new DigestInputStream(it, hash).transferTo(OutputStream.nullOutputStream()) }
            HexFormat.of().formatHex(hash.digest()) + '  ' + path + '\n'
        }.join(), 'UTF-8')
    }
}
tasks.named('jar') {
    dependsOn bundleRuntime
    from(runtimeDirectory) { into runtimeEntry }
    into('META-INF/licenses/prime-pt') {
        from('LICENSE', 'NOTICE')
        from('licenses') { into 'licenses' }
        from('crates/minecraft/assets/vanilla_pbr/SOURCE-LICENSE.md') { into 'vanilla_pbr' }
    }
    into('META-INF/licenses/simple-engine') {
        from('../../LICENSE', '../../NOTICE', '../../THIRD_PARTY_NOTICES.md')
        from('../../LICENSES') { into 'LICENSES' }
    }
}
def releaseJar = tasks.named('jar').flatMap { it.archiveFile }
def bundledRuntimeFixture = tasks.register('bundledRuntimeFixture', JavaExec) {
    dependsOn fixtureClasses, tasks.named('jar')
    classpath = files(sourceSets.fixture.output, releaseJar)
    mainClass = 'dev.primept.BundledRuntimeFixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    workingDir layout.buildDirectory
    environment.remove('SLANGC')
    environment.remove('VULKAN_SDK')
    args rootProject.file('target/bundled-runtime-fixture').absolutePath
}
tasks.register('buildRelease') {
    dependsOn tasks.named('build'), bundledRuntimeFixture
    doLast { logger.lifecycle(releaseJar.get().asFile.absolutePath) }
}
tasks.register('wireFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.WireFixture'
    args rootProject.file('target/java-source.prt').absolutePath
}

tasks.register('cameraFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.CameraFixture'
}

tasks.register('terrainSnapshotFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.TerrainSnapshotFixture'
}

tasks.register('renderTuningFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.RenderTuningFixture'
    args rootProject.file('target/render-tuning-fixture.properties').absolutePath
}

tasks.register('environmentFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.EnvironmentFixture'
}

tasks.register('exposureFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.ExposureFixture'
    args rootProject.file('target/exposure-fixture.properties').absolutePath
}

tasks.register('videoOptionsFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.VideoOptionsFixture'
}

tasks.register('settingsLanguageFixture', JavaExec) {
    dependsOn fixtureClasses, tasks.named('jar')
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.SettingsLanguageFixture'
    args tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
}

tasks.register('startupSupportFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.StartupSupportFixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('commandHintsFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.CommandHintsFixture'
}

tasks.register('sourceChangesFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.SourceChangesFixture'
}

tasks.register('streamlineFixture', JavaExec) {
    dependsOn fixtureClasses
    if (providers.gradleProperty('bundledRuntime').getOrElse('false').toBoolean()) {
        dependsOn tasks.named('jar')
        classpath = files(sourceSets.fixture.runtimeClasspath - sourceSets.main.output, releaseJar)
        workingDir rootProject.file('target/bundled-streamline-fixture')
        doFirst { workingDir.mkdirs() }
        args '--bundled'
        environment.remove('SLANGC')
        environment.remove('VULKAN_SDK')
    } else {
        if (!nativeLibraryOverride.isPresent()) dependsOn tasks.named('buildNative')
        classpath = sourceSets.fixture.runtimeClasspath
        systemProperty 'primept.native', nativeLibraryPath
    }
    mainClass = 'dev.primept.StreamlineFixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dorg.lwjgl.vulkan.explicitInit=true'
}

tasks.register('frameChartFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.FrameChartFixture'
    jvmArgs '-Djava.awt.headless=true'
    if (providers.gradleProperty('frameChartImage').isPresent())
        args providers.gradleProperty('frameChartImage').get()
    if (providers.gradleProperty('nativeFrameChart').isPresent())
        args '--native=' + providers.gradleProperty('nativeFrameChart').get()
}

tasks.register('unsupportedDeviceFixture', JavaExec) {
    dependsOn fixtureClasses
    if (!nativeLibraryOverride.isPresent()) dependsOn tasks.named('buildNative')
    classpath = sourceSets.fixture.runtimeClasspath
    systemProperty 'primept.native', nativeLibraryPath
    mainClass = 'dev.primept.StreamlineFixture'
    args '--unsupported'
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dorg.lwjgl.vulkan.explicitInit=true'
}

tasks.named('check') {
    dependsOn tasks.named('startupSupportFixture')
    dependsOn tasks.named('terrainSnapshotFixture')
    dependsOn tasks.named('renderTuningFixture')
    dependsOn tasks.named('cameraFixture'), tasks.named('environmentFixture'), tasks.named('exposureFixture'),
            tasks.named('videoOptionsFixture'), tasks.named('settingsLanguageFixture'), tasks.named('commandHintsFixture'),
            tasks.named('sourceChangesFixture'), tasks.named('frameChartFixture')
}

// 不启动客户端；由26.3真实原版代码生成Rust数学对照。
tasks.register('tintFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.TintFixture'
    args rootProject.file('target/java-tint.bin').absolutePath
}

tasks.register('compactSourceFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.CompactSourceFixture'
    args rootProject.file('target/java-compact.bin').absolutePath
}

tasks.register('modelRandomFixture', JavaExec) {
    dependsOn fixtureClasses
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.ModelRandomFixture'
    args rootProject.file('target/java-model-random.bin').absolutePath
}

tasks.register('nativeBatchFixture', JavaExec) {
    dependsOn fixtureClasses
    if (!nativeLibraryOverride.isPresent()) dependsOn tasks.named('buildNative')
    classpath = sourceSets.fixture.runtimeClasspath
    mainClass = 'dev.primept.NativeBatchFixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'primept.native', nativeLibraryPath
}
