[package]
name = "prime_pt"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prime_scene = { path = "../crates/scene" }
prime_world = { path = "../crates/world" }
prime_renderer = { path = "../crates/renderer" }
prime_minecraft = { path = "../crates/minecraft" }
thiserror = "2"
simple_engine = { workspace = true, features = ["frame_loop", "atmosphere"] }


[lints.rust]
missing_docs = "deny"
[lints.rustdoc]
broken_intra_doc_links = "deny"
