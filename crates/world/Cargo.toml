[package]
name = "prime_world"
version = "0.1.0"
edition = "2024"
[features]
test-fixtures = ["prime_minecraft/fixtures"]
[dependencies]
prime_scene = { path = "../scene" }
prime_minecraft = { path = "../minecraft" }
thiserror = "2"
rayon = "1.12"
chunk_manager = { path = "../../../../crates/chunk_manager" }
[dev-dependencies]
prime_minecraft = { path = "../minecraft", features = ["fixtures"] }
serde_json = "1.0.154"
blake3 = "1.8.7"

[[bench]]
name = "source_pipeline"
harness = false
required-features = ["test-fixtures"]

[lints.rust]
missing_docs = "deny"
[lints.rustdoc]
broken_intra_doc_links = "deny"
