[package]
name = "prime_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
prime_scene = { path = "../scene" }
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
simple_engine = { workspace = true, features = [
    "light_sampling",
    "camera",
    "scene_cache",
    "pt_gpu",
    "restir_pt_gpu",
    "dlss_rr",
    "openpbr_program",
    "shader_build",
    "shader_library",
    "atmosphere_native",
    "display",
] }

[dev-dependencies]
prime_world = { path = "../world", features = ["test-fixtures"] }
ash = { git = "https://github.com/ash-rs/ash.git", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
blake3 = "1.8.7"
serde_json = "1.0.154"

[build-dependencies]
simple_engine = { workspace = true, features = ["shader_build", "shader_library"] }

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
