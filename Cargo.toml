[workspace]
resolver = "3"
members = ["native", "crates/scene", "crates/world", "crates/renderer", "crates/minecraft"]

[workspace.dependencies]
simple_engine = { path = "../..", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
